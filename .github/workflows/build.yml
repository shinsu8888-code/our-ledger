name: Build APK

# GitHub에 코드를 올리면 APK를 자동으로 만들어 줍니다.
# 결과는 페이지 하단 Artifacts의 "couple-ledger-apk" 에서 내려받을 수 있어요.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project files
        run: flutter create . --org com.example --project-name couple_ledger

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: couple-ledger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
