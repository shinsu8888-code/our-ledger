name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android Project
        run: flutter create .

      - name: Patch Gradle
        run: |
          FILE=android/app/build.gradle.kts

          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' "$FILE"

          sed -i '/compileOptions {/a\
                  isCoreLibraryDesugaringEnabled = true' "$FILE"

          echo "" >> "$FILE"
          echo "dependencies {" >> "$FILE"
          echo "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")" >> "$FILE"
          echo "}" >> "$FILE"

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: couple-ledger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
