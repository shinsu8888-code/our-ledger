name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Create Android Project
        run: flutter create . --org com.example --project-name couple_ledger

      - name: Configure Android Build
        run: |
          FILE=android/app/build.gradle.kts

          if [ -f "$FILE" ]; then

            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/g' "$FILE"

            sed -i '/compileOptions {/a\
                    isCoreLibraryDesugaringEnabled = true' "$FILE"

            sed -i '/dependencies {/a\
                    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' "$FILE"

            echo "===== build.gradle.kts ====="
            cat "$FILE"
          fi

      - name: Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: couple-ledger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
