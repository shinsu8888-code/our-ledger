name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Generate Flutter Platforms
        run: flutter create . --org com.example --project-name couple_ledger

      - name: Show Android Structure
        run: |
          echo "=============================="
          echo "ANDROID FILES"
          echo "=============================="
          find android -type f | sort

      - name: Show Gradle Files
        run: |
          echo "=============================="
          echo "GRADLE FILES"
          echo "=============================="
          find android -name "*.gradle*" -type f

      - name: Show build.gradle.kts
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            echo "FOUND build.gradle.kts"
            echo "=============================="
            cat android/app/build.gradle.kts
          else
            echo "build.gradle.kts NOT FOUND"
          fi

      - name: Show build.gradle
        run: |
          if [ -f android/app/build.gradle ]; then
            echo "FOUND build.gradle"
            echo "=============================="
            cat android/app/build.gradle
          else
            echo "build.gradle NOT FOUND"
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: couple-ledger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
